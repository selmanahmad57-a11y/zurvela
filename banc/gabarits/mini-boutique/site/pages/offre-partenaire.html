<!DOCTYPE html>
<html lang="{{langue}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{piege.titre}} — {{site.nom}}</title>
  <meta name="description" content="{{piege.intro}}">
  <link rel="stylesheet" href="/statique/style.css">
  <link rel="icon" href="/statique/images/logo.svg" type="image/svg+xml">
</head>
<body data-role="page-piege">
  <header class="entete">
    <a class="marque" href="/">
      <img data-role="logo" src="/statique/images/logo.svg" alt="{{site.nom}}" width="40" height="40">
      <span>{{site.nom}}</span>
    </a>
    <nav aria-label="{{nav.libelle}}">
      <ul>
        <li><a href="/">{{nav.accueil}}</a></li>
        <li><a href="/catalogue">{{nav.catalogue}}</a></li>
        <li><a href="/livraison">{{nav.livraison}}</a></li>
      </ul>
    </nav>
  </header>
  <main class="contenu">
    <h1>{{piege.titre}}</h1>
    <p class="intro">{{piege.intro}}</p>
    <p>{{piege.texte}}</p>
  </main>
  <footer class="pied">
    <p>{{pied.mentions}}</p>
  </footer>
</body>
</html>
