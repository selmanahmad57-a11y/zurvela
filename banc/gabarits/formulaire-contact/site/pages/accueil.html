<!DOCTYPE html>
<html lang="{{langue}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{accueil.titre}} — {{site.nom}}</title>
  <meta name="description" content="{{site.slogan}}">
  <link rel="stylesheet" href="/statique/style.css">
  <link rel="icon" href="/statique/images/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="entete">
    <a class="marque" href="/">
      <img data-role="logo" src="/statique/images/logo.svg" alt="{{site.nom}}" width="40" height="40">
      <span>{{site.nom}}</span>
    </a>
    <nav aria-label="{{nav.libelle}}">
      <ul>
        <li><a href="/" aria-current="page">{{nav.accueil}}</a></li>
        <li><a href="/contact">{{nav.contact}}</a></li>
      </ul>
    </nav>
  </header>
  <main class="contenu">
    <h1>{{accueil.titre}}</h1>
    <p class="intro">{{accueil.intro}}</p>
    <section>
      <h2>{{accueil.prestationsTitre}}</h2>
      <ul>
        <li>{{accueil.prestation1}}</li>
        <li>{{accueil.prestation2}}</li>
        <li>{{accueil.prestation3}}</li>
      </ul>
    </section>
    <p><a class="bouton" href="/contact">{{accueil.appel}}</a></p>
  </main>
  <!--
    LES SCHÉMAS LOCAUX (correctif du 2026-10-03). Cette page demande deux
    ressources qui ne partent JAMAIS sur le réseau : un objet `blob:` créé
    par la page, et une image `data:`. Le moteur ne doit en faire aucune
    candidate — mesuré sur le réel, les quatorze « réponse lente » publiées
    portaient toutes sur une `blob:` URL. Les vraies ressources de la page
    (feuille de style, logo) doivent, elles, rester observées.
  -->
  <img data-role="pixel-local" alt="" width="1" height="1"
       src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <script>
    try {
      var objet = URL.createObjectURL(new Blob(['x'], { type: 'text/plain' }));
      fetch(objet).catch(function () {});
    } catch (erreur) { /* le gabarit ne doit jamais casser la page */ }
  </script>
  <footer class="pied">
    <p>{{pied.mentions}}</p>
  </footer>
</body>
</html>
